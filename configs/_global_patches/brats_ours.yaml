# @package _global_
# merge this file to global config

dataset:
  task: seg

model:
  in_channels: 4
  num_classes: 3
  spatial_dims: 3
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  norm: "BATCH"
  act: "RELU"
  dropout: 0.0

tta:
  # online continual TTA: per-volume
  enforce_bs1: true

  episodic: false
  steps_per_batch: 10

  # scope of student parameter updates
  adapt_params: bn_affine     # bn_affine | norm_affine | all
  force_train_bn: true
  disable_dropout: true
  grad_clip_norm: null

  clear_optim_state: true
  ckpt_path: null


  save:
    enabled: false
    dir: ${hydra:run.dir}/pred_masks
    format: nii.gz
    pred_type: auto
    threshold: 0.5
    class_names: [ET, TC, WT]
    only_rank0: true

    save_initial: false
    initial_once: true
    initial_subdir: init
    tta_subdir: tta

  # ours specific
  ours:
    enable_consistency: true
    enable_pseudo_label: true
    enable_feat_align: true
    enable_entropy: false
    predict_with_teacher: true

    consistency:
      include_full: false

    uncertainty:
      reduce: "mean"          # mean | max | sum over classes

    views:
      scheme: "full+interventions"
      drop_mode: "zero"

      # Fixed intervention *types* (full + 2 probes), but with per-step random
      # modality-pair sampling to match the LFCCS/UGPS description in the paper.
      interventions:
        - type: amp_swap_lowfreq
          lowfreq_ratio: 0.10
          pair_mode: random_per_step   # sample a distinct modality pair (a,b) each step
        - type: patch_swap_uncertain
          unc_thr: null
          unc_quantile: 0.95
          dilate_ks: 15
          mode: swap                   # swap | replace
          pair_mode: random_per_step   # sample a distinct modality pair (a,b) each step
        
    bn:
      update_stats: true
      update_affine: true

    teacher:
      ema_decay: 0.99
      bn_buffers: "copy"      # copy | ema | frozen_source

    pseudo_label:
      # per-class thresholds for [ET, TC, WT]
      pos_thr: 0.95
      neg_thr: 0.05
      var_thr: 0.02

      use_neg: true
      neg_weight: 0.1
      hierarchy_fix: true
      min_voxels: 0
      # paper-style hard variance gate (filter unstable voxels)
      var_gate: true
      var_weight:
        enable: false

    feat_align:
      # Fill with the bottleneck module path from model.named_modules().
      hook_name: "model.1.submodule.1.submodule.1.submodule.1.submodule"
      feat_type: "gap"        # gap | meanvar | dense
      include_full: false

    loss:
      w_cons: 1.0
      w_pl: 1.0
      w_feat: 0.1
      w_ent: 0.0

training:
  method: ours
  epochs: 1
  eval_on_train: false

  eval_test:
    start_epoch: 0
    every_n_epochs: 1
    run_last: true
    do_val: false
    do_test: true

  data:
    transforms:
      normalize: false
      geom_aug: false
      intensity_aug: false
      image_size: [160, 192, 160]
      mean: [0.0, 0.0, 0.0, 0.0]
      std:  [1.0, 1.0, 1.0, 1.0]  # placeholder; set to your actual

  criterion:
    include_background: true
    squared_pred: false
    jaccard: false
    lambda_dice: 1.0
    lambda_ce: 1.0
    softmax: false
    sigmoid: true

evaluation:
  per_class: true
  surface:
    enable: true
    asd_symmetric: true
  seg:
    region_order: ["ET", "TC", "WT"]
    threshold: 0.5
  loss:
    report_loss: true
  class_names: ["ET", "TC", "WT"]
